<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ACNH Museum Checklist</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
}

table {
  border-collapse: collapse;
  width: 100%;
  margin-bottom: 30px;
}

th, td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: left;
  vertical-align: top;
}

img {
  width: 200px;
}

.completed {
  text-decoration: line-through;
  color: grey;
}

.tooltip {
  position: absolute;
  background: #333;
  color: white;
  padding: 8px;
  border-radius: 6px;
  font-size: 13px;
  max-width: 300px;
  display: none;
  z-index: 1000;
  pointer-events: none;
}
</style>

</head>

<body>

<h1>🐾 Animal Crossing New Horizons Museum Checklist</h1>

<label for="month">Select Month: </label>
<select id="month">
  <option>Jan</option><option>Feb</option><option>Mar</option>
  <option>Apr</option><option>May</option><option>Jun</option>
  <option>Jul</option><option>Aug</option><option>Sep</option>
  <option>Oct</option><option>Nov</option><option>Dec</option>
</select>

<p id="progress"></p>

<h2>Fish</h2>

<table id="fish-table">
<thead>
  <tr>
    <th>Done</th>
    <th>Name</th>
    <th>Icon</th>
    <th>Sell</th>
    <th>Where/How</th>
    <th>Shadow</th>
    <th>Catch Difficulty</th>
    <th>Vision</th>
    <th>Availability (NH / SH)</th>
  </tr>
</thead>
<tbody></tbody>
</table>

<div id="tooltip" class="tooltip"></div>

<script>
let data = { fish: [] };
let state = JSON.parse(localStorage.getItem("museum")) || {};

function save() {
  localStorage.setItem("museum", JSON.stringify(state));
}

/* ---------------- TIME PARSER ---------------- */

function parseTimeRange(str) {
  if (!str || str === "NA") return null;
  if (str === "All day") return { start: 0, end: 24 };

  const match = str.match(/(\d+)\s*(AM|PM)\s*–\s*(\d+)\s*(AM|PM)/i);
  if (!match) return null;

  let [, h1, p1, h2, p2] = match;

  const start = to24(+h1, p1);
  const end = to24(+h2, p2);

  return { start, end };
}

function to24(h, p) {
  p = p.toUpperCase();
  if (p === "AM") return h === 12 ? 0 : h;
  if (p === "PM") return h === 12 ? 12 : h + 12;
}

function split(range) {
  if (!range) return [];

  if (range.start < range.end) {
    return [{ start: range.start, end: range.end }];
  }

  // crosses midnight
  return [
    { start: range.start, end: 24 },
    { start: 0, end: range.end }
  ];
}

function fmt(h) {
  if (h === 0 || h === 24) return "12 AM";
  if (h === 12) return "12 PM";
  if (h < 12) return `${h} AM`;
  return `${h - 12} PM`;
}

/* ---------------- RENDER TIMELINE ---------------- */

function renderTimeline(label, value, color) {
  if (value === "All day") {
    return `
      <div style="margin-bottom:6px;">
        <div style="font-size:10px;">${label}</div>

        <div style="
          height:18px;
          background:${color};
          border-radius:6px;
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:11px;
          font-weight:bold;
          color:black;
        ">
          Whole day
        </div>
      </div>
    `;
  }

  const range = parseTimeRange(value);

  if (!range) {
    return `
      <div style="font-size:11px;">
        ${label} <span style="color:#999">Not Available</span>
      </div>
    `;
  }

  const segments = split(range);

  return `
    <div style="margin-bottom:6px;">
      <div style="font-size:10px;">${label}</div>

      <div style="
        position:relative;
        height:18px;
        background:#eee;
        border-radius:6px;
        overflow:hidden;
        font-size:10px;
      ">

        ${segments.map(s => `
          <div style="
            position:absolute;
            left:${(s.start/24)*100}%;
            width:${((s.end - s.start)/24)*100}%;
            height:100%;
            background:${color};
            opacity:0.85;
          "></div>
        `).join("")}

        <!-- start label -->
        <div style="
          position:absolute;
          left:${(range.start/24)*100}%;
          top:0;
          transform:translateX(-50%);
          font-size:9px;
        ">
          ${fmt(range.start)}
        </div>

        <!-- end label -->
        <div style="
          position:absolute;
          left:${(range.end/24)*100}%;
          top:0;
          transform:translateX(-50%);
          font-size:9px;
        ">
          ${fmt(range.end)}
        </div>

      </div>
    </div>
  `;
}

/* ---------------- TABLE ---------------- */

function renderTable() {
  const tbody = document.querySelector("#fish-table tbody");
  tbody.innerHTML = "";

  const month = document.getElementById("month").value;
  const tooltip = document.getElementById("tooltip");

  data.fish.forEach(item => {
    const tr = document.createElement("tr");
    const checked = state[item.Name] || false;

    const nh = item[`NH ${month}`] || "NA";
    const sh = item[`SH ${month}`] || "NA";

    tr.innerHTML = `
      <td><input type="checkbox" ${checked ? "checked" : ""}></td>

      <td class="name-cell ${checked ? "completed" : ""}">
        ${item.Name}
      </td>

      <td>
        <img src="/icon/BookFishIcon/${item["Critterpedia Filename"]}.png">
      </td>

      <td>${item.Sell}</td>
      <td>${item["Where/How"]}</td>
      <td>${item.Shadow}</td>
      <td>${item["Catch Difficulty"]}</td>
      <td>${item.Vision}</td>

      <td>
        ${renderTimeline("NH", nh, "#4caf50")}
        ${renderTimeline("SH", sh, "#2196f3")}
      </td>
    `;

    /* tooltip */
    const nameCell = tr.querySelector(".name-cell");

    function show(e) {
      tooltip.style.display = "block";
      tooltip.textContent = item.Description || "No description";
      tooltip.style.left = e.pageX + 10 + "px";
      tooltip.style.top = e.pageY + 10 + "px";
    }

    function hide() {
      tooltip.style.display = "none";
    }

    nameCell.addEventListener("mousemove", show);
    nameCell.addEventListener("mouseleave", hide);

    /* checkbox */
    const checkbox = tr.querySelector("input");
    checkbox.addEventListener("change", () => {
      state[item.Name] = checkbox.checked;
      save();
      renderAll();
    });

    tbody.appendChild(tr);
  });
}

/* ---------------- PROGRESS ---------------- */

function updateProgress() {
  const total = data.fish.length;
  const done = data.fish.filter(i => state[i.Name]).length;

  document.getElementById("progress").textContent =
    `Progress: ${done} / ${total}`;
}

function renderAll() {
  renderTable();
  updateProgress();
}

/* ---------------- LOAD ---------------- */

fetch("/files/fish.json")
  .then(r => r.json())
  .then(j => {
    data.fish = j;
    renderAll();
  });

/* ---------------- MONTH ---------------- */

document.getElementById("month").addEventListener("change", renderAll);

const now = new Date().toLocaleString("en-AU", { month: "short" });
document.getElementById("month").value = now;

</script>

</body>
</html>
